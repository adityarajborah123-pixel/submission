<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard - SME Loan</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            background: #eef3f9;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .box {
            width: 70%;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #0b4da2;
            margin-bottom: 25px;
            font-size: 28px;
        }

        .dashboard-options {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
        }

        .option-btn {
            width: 200px;
            padding: 20px;
            background: #0b4da2;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .option-btn:hover {
            background: #093b7c;
            transform: translateY(-2px);
        }

        .back-btn {
            background: #6c757d;
            margin-top: 20px;
            width: 100%;
        }

        .back-btn:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Employee Dashboard</h2>
        <p style="text-align: center; color: #555; margin-bottom: 30px;">Welcome! Choose an option to proceed:</p>

        <div class="dashboard-options">
            <button class="option-btn" onclick="window.location.href='newapplicantlist.html'">New Application</button>
            <button class="option-btn" onclick="window.location.href='applicants-list.html'">Old Application</button>
        </div>

        <button type="button" class="option-btn back-btn" onclick="window.location.href='employee-login.html'">Logout</button>
    </div>
</body>
</html>
